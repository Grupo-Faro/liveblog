name: Release

# Publishing a version:
#   1. bump the version in elfaro-liveblogs.php (header + WPCOM_Liveblog::VERSION) and package.json
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
# This builds the assets, packages elfaro-liveblogs.zip and attaches it to a
# GitHub Release, which is where the plugin's updater looks for new versions.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish elfaro-liveblogs.zip
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the release and upload the asset

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          # Disabled to prevent cache poisoning in release workflows
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check that the tag matches the plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 -E '^ \* Version:' elfaro-liveblogs.php | sed -E 's/.*Version:[[:space:]]*//')
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match the plugin version $version"
            exit 1
          fi

      - name: Package the plugin
        run: |
          mkdir -p dist/elfaro-liveblogs
          rsync -a --exclude-from=.distignore --exclude=".DS_Store" ./ dist/elfaro-liveblogs/
          (cd dist && zip -q -r -X elfaro-liveblogs.zip elfaro-liveblogs)
          unzip -l dist/elfaro-liveblogs.zip | tail -1

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/elfaro-liveblogs.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
